<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=world.html">
  <meta name="theme-color" content="#e9f8f2">
  <meta name="description" content="بستان، مساحة لعب وتعلّم للأطفال: الحروف والأرقام والألوان." />
  <title>عالم بكرة | مغامرتك تبدأ بالتعلّم</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #183d38;
      --muted: #66817a;
      --green: #227b67;
      --green-dark: #155e50;
      --mint: #e9f8f2;
      --paper: #fffefa;
      --coral: #f17863;
      --yellow: #f5c64c;
      --blue: #76b9d6;
      --line: #dcebe4;
      --shadow: 0 14px 40px rgba(32, 83, 68, .09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--mint);
      background-image: radial-gradient(rgba(34, 123, 103, .09) 1px, transparent 1px);
      background-size: 22px 22px;
      font-family: "Baloo Bhaijaan 2", "Noto Sans Arabic", sans-serif;
    }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
    .shell { max-width: 1120px; padding: 24px 28px 38px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 16px; background: var(--green); color: white; font-size: 27px; box-shadow: 0 6px 0 var(--green-dark); }
    .brand-name { margin: 0; font-size: 25px; font-weight: 800; line-height: 1; }
    .brand-caption { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .score { display: flex; align-items: center; gap: 8px; padding: 8px 15px; border: 1px solid #f1dfa8; border-radius: 999px; background: #fff9e8; color: #775b11; font-weight: 800; }
    .score-star { color: #e8ad16; font-size: 21px; line-height: 1; }
    .welcome { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .welcome h1 { margin: 0; font-size: clamp(25px, 4vw, 35px); line-height: 1.2; }
    .welcome p { margin: 6px 0 0; color: var(--muted); font-size: 17px; }
    .welcome-sticker { font-size: 48px; transform: rotate(-8deg); }
    .workspace { display: grid; grid-template-columns: 218px minmax(0, 1fr); gap: 20px; align-items: start; }
    .side-panel, .lesson-panel, .quiz-panel { border: 1px solid rgba(204, 227, 216, .9); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .side-panel { padding: 17px 12px; }
    .side-title { margin: 0 10px 12px; color: var(--muted); font-size: 14px; font-weight: 700; }
    .nav-list { display: grid; gap: 7px; }
    .nav-button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; border: 0; border-radius: 12px; background: transparent; color: var(--ink); text-align: right; cursor: pointer; transition: background .18s, transform .18s; }
    .nav-button:hover { background: #f0f8f4; transform: translateX(-2px); }
    .nav-button[aria-pressed="true"] { background: #e5f4ed; color: var(--green-dark); font-weight: 800; }
    .nav-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: white; font-size: 19px; }
    .main-content { display: grid; gap: 18px; }
    .lesson-panel { overflow: hidden; }
    .lesson-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 22px; border-bottom: 1px solid #edf3ef; }
    .lesson-heading h2 { margin: 0; font-size: 19px; }
    .lesson-count { color: var(--muted); font-size: 14px; }
    .lesson-stage { position: relative; display: grid; grid-template-columns: minmax(150px, .8fr) minmax(220px, 1.2fr); min-height: 260px; padding: 24px; overflow: hidden; background: linear-gradient(120deg, #e8f6ef 0%, #eff9f5 58%, #fdf6df 100%); }
    .lesson-stage::after { position: absolute; right: 48%; bottom: -97px; width: 220px; height: 220px; border: 1px dashed rgba(34, 123, 103, .19); border-radius: 50%; content: ""; }
    .symbol-wrap { z-index: 1; display: grid; place-items: center; }
    .symbol { display: grid; width: 154px; height: 154px; place-items: center; border: 5px solid rgba(255,255,255,.85); border-radius: 42px; background: var(--yellow); color: #59420e; font-size: 94px; font-weight: 800; line-height: 1; box-shadow: 0 10px 0 rgba(151, 116, 24, .14), 0 15px 30px rgba(69, 80, 49, .1); animation: pop-in .35s ease both; }
    .symbol.is-emoji { font-size: 80px; }
    .lesson-copy { z-index: 1; align-self: center; padding: 10px 18px; }
    .eyebrow { margin: 0 0 3px; color: var(--green); font-size: 15px; font-weight: 800; }
    .lesson-word { margin: 0; font-size: 34px; font-weight: 800; line-height: 1.2; }
    .lesson-description { margin: 7px 0 15px; color: #52726a; font-size: 16px; }
    .example-art { min-height: 38px; margin: -7px 0 8px; font-size: 29px; line-height: 1.2; }
    .sound-button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border: 1px solid #bfdfd0; border-radius: 10px; background: white; color: var(--green-dark); font-weight: 800; cursor: pointer; }
    .sound-button:hover { background: #f5fcf8; }
    .lesson-controls { display: flex; justify-content: space-between; align-items: center; padding: 13px 20px; }
    .dots { display: flex; gap: 7px; direction: ltr; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d7e7df; }
    .dot.active { width: 22px; border-radius: 9px; background: var(--green); }
    .arrow-controls { display: flex; gap: 8px; }
    .arrow-button { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid var(--line); border-radius: 11px; background: white; color: var(--ink); font-size: 20px; cursor: pointer; }
    .arrow-button:hover { border-color: var(--green); color: var(--green); }
    .quiz-panel { padding: 20px 22px 22px; }
    .quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .quiz-title { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 20px; }
    .quiz-badge { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: #fff3d3; font-size: 18px; }
    .quiz-hint { margin: 5px 0 14px; color: var(--muted); }
    .answers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .answer { min-height: 54px; padding: 8px 12px; border: 1px solid #dcebe4; border-radius: 12px; background: #fff; color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
    .answer:hover:not(:disabled) { border-color: #84bca6; background: #f5fcf8; transform: translateY(-2px); }
    .answer.correct { border-color: #76b797; background: #e8f7ee; color: #176344; }
    .answer.wrong { border-color: #ed9b8d; background: #fff0ed; color: #a74536; }
    .answer:disabled { cursor: default; }
    .feedback { min-height: 26px; margin: 12px 0 0; font-weight: 800; }
    .feedback.success { color: #237653; }
    .feedback.retry { color: #ae5a48; }
    .footer-note { margin: 20px 0 0; color: #66817a; font-size: 13px; text-align: center; }
    @keyframes pop-in { from { opacity: .5; transform: scale(.9) rotate(-4deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @media (max-width: 720px) {
      .shell { padding: 17px 15px 27px; }
      .workspace { grid-template-columns: 1fr; gap: 14px; }
      .side-panel { padding: 10px; }
      .side-title { display: none; }
      .nav-list { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
      .nav-button { justify-content: center; flex-direction: column; gap: 3px; padding: 7px 3px; font-size: 14px; }
      .nav-button:hover { transform: translateY(-2px); }
      .nav-icon { width: 32px; height: 30px; }
      .lesson-stage { grid-template-columns: minmax(110px, .8fr) minmax(0, 1.2fr); min-height: 218px; padding: 15px 12px; }
      .symbol { width: 115px; height: 115px; border-radius: 32px; font-size: 72px; }
      .symbol.is-emoji { font-size: 60px; }
      .lesson-copy { padding: 8px 10px; }
      .lesson-word { font-size: 28px; }
      .lesson-description { font-size: 15px; }
      .quiz-panel { padding: 16px; }
    }
    @media (max-width: 400px) {
      .brand-caption { font-size: 12px; }
      .welcome-sticker { font-size: 38px; }
      .lesson-stage { grid-template-columns: 105px minmax(0, 1fr); }
      .symbol { width: 98px; height: 98px; font-size: 62px; }
      .symbol.is-emoji { font-size: 52px; }
      .lesson-word { font-size: 25px; }
      .answers { grid-template-columns: 1fr; gap: 7px; }
      .answer { min-height: 45px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand" aria-label="بستان">
        <div class="brand-mark" aria-hidden="true">ب</div>
        <div>
          <p class="brand-name">بُستان</p>
          <p class="brand-caption">مساحة صغيرة.. واكتشافات كبيرة</p>
        </div>
      </div>
      <div class="score" aria-live="polite"><span class="score-star" aria-hidden="true">★</span><span id="score">٠ نجوم</span></div>
    </header>

    <section class="welcome">
      <div>
        <h1>أهلًا يا بطل! 👋</h1>
        <p>جاهز نتعلم حاجة جديدة النهارده؟</p>
      </div>
      <div class="welcome-sticker" aria-hidden="true">🌱</div>
    </section>

    <div class="workspace">
      <aside class="side-panel" aria-label="أنشطة التعلم">
        <p class="side-title">اختار مغامرتك</p>
        <nav class="nav-list">
          <button class="nav-button" data-mode="letters" aria-pressed="true"><span class="nav-icon" aria-hidden="true">أ</span><span>الحروف</span></button>
          <button class="nav-button" data-mode="numbers" aria-pressed="false"><span class="nav-icon" aria-hidden="true">🔢</span><span>الأرقام</span></button>
          <button class="nav-button" data-mode="colors" aria-pressed="false"><span class="nav-icon" aria-hidden="true">🎨</span><span>الألوان</span></button>
        </nav>
      </aside>

      <main class="main-content">
        <section class="lesson-panel" aria-labelledby="lesson-title">
          <div class="lesson-heading">
            <h2 id="lesson-title">نتعرف على الحروف</h2>
            <span class="lesson-count" id="lesson-count">١ من ٥</span>
          </div>
          <div class="lesson-stage">
            <div class="symbol-wrap"><div class="symbol" id="symbol" aria-hidden="true">أ</div></div>
            <div class="lesson-copy">
              <p class="eyebrow" id="eyebrow">حرف اليوم</p>
              <h3 class="lesson-word" id="word">أسد</h3>
              <p class="lesson-description" id="description">أَسَد يبدأ بحرف الألف!</p>
              <p class="example-art" id="example-art" aria-hidden="true">🦁</p>
              <button class="sound-button" id="speak" type="button"><span aria-hidden="true">🔊</span> اسمع النطق</button>
            </div>
          </div>
          <div class="lesson-controls">
            <div class="dots" id="dots" aria-hidden="true"></div>
            <div class="arrow-controls">
              <button class="arrow-button" id="next" type="button" aria-label="العنصر التالي">←</button>
              <button class="arrow-button" id="previous" type="button" aria-label="العنصر السابق">→</button>
            </div>
          </div>
        </section>

        <section class="quiz-panel" aria-labelledby="quiz-title">
          <div class="quiz-top">
            <h2 class="quiz-title" id="quiz-title"><span class="quiz-badge" aria-hidden="true">✨</span>يلا نلعب!</h2>
          </div>
          <p class="quiz-hint" id="quiz-hint">اختار الكلمة اللي بتبدأ بحرف أ</p>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
        </section>
      </main>
    </div>
    <p class="footer-note">كل إجابة صح تقرّبك من نجمة جديدة 🌟</p>
  </div>

  <script>
    const activities = {
      letters: {
        title: "نتعرف على الحروف",
        eyebrow: "حرف اليوم",
        hint: item => `اختار الكلمة اللي بتبدأ بحرف ${item.symbol}`,
        items: [
          { symbol: "أ", word: "أسد", description: "أَسَد يبدأ بحرف الألف!", emoji: "🦁", choices: ["أسد", "بطة", "تفاحة"], answer: "أسد" },
          { symbol: "ب", word: "بطة", description: "بَطّة تبدأ بحرف الباء!", emoji: "🦆", choices: ["جمل", "بطة", "ثعلب"], answer: "بطة" },
          { symbol: "ت", word: "تفاحة", description: "تُفاحة تبدأ بحرف التاء!", emoji: "🍎", choices: ["تفاحة", "أسد", "بطة"], answer: "تفاحة" },
          { symbol: "ث", word: "ثعلب", description: "ثَعلب يبدأ بحرف الثاء!", emoji: "🦊", choices: ["تفاحة", "ثعلب", "جمل"], answer: "ثعلب" },
          { symbol: "ج", word: "جمل", description: "جَمَل يبدأ بحرف الجيم!", emoji: "🐪", choices: ["بطة", "أسد", "جمل"], answer: "جمل" }
        ]
      },
      numbers: {
        title: "مغامرة الأرقام",
        eyebrow: "نعدّ مع بعض",
        hint: item => `عدّ النجوم واختار الرقم ${item.symbol}`,
        items: [
          { symbol: "١", word: "واحد", description: "نجمة واحدة تلمع في السماء!", emoji: "⭐", choices: ["١", "٢", "٣"], answer: "١" },
          { symbol: "٢", word: "اثنان", description: "سمكتان صغيرتان تسبحان معًا!", emoji: "🐟🐟", choices: ["٣", "٢", "١"], answer: "٢" },
          { symbol: "٣", word: "ثلاثة", description: "ثلاث ثمرات لذيذة!", emoji: "🍓🍓🍓", choices: ["٢", "٤", "٣"], answer: "٣" },
          { symbol: "٤", word: "أربعة", description: "أربع زهرات جميلة!", emoji: "🌼🌼🌼🌼", choices: ["٤", "١", "٣"], answer: "٤" },
          { symbol: "٥", word: "خمسة", description: "خمسة بالونات ملونة!", emoji: "🎈🎈🎈🎈🎈", choices: ["٣", "٥", "٢"], answer: "٥" }
        ]
      },
      colors: {
        title: "عالم الألوان",
        eyebrow: "لون جديد",
        hint: item => `اختار اللون ${item.word}`,
        items: [
          { symbol: "●", word: "أحمر", description: "الفراولة لونها أحمر!", color: "#ef7462", emoji: "🍓", choices: ["أزرق", "أحمر", "أصفر"], answer: "أحمر" },
          { symbol: "●", word: "أزرق", description: "البحر الواسع لونه أزرق!", color: "#63afd1", emoji: "🌊", choices: ["أخضر", "أصفر", "أزرق"], answer: "أزرق" },
          { symbol: "●", word: "أصفر", description: "الشمس الدافئة لونها أصفر!", color: "#f2c34b", emoji: "☀️", choices: ["أحمر", "أصفر", "أزرق"], answer: "أصفر" },
          { symbol: "●", word: "أخضر", description: "ورق الشجر لونه أخضر!", color: "#63a77e", emoji: "🌿", choices: ["أزرق", "أخضر", "أحمر"], answer: "أخضر" },
          { symbol: "●", word: "برتقالي", description: "البرتقال لونه برتقالي!", color: "#ed9850", emoji: "🍊", choices: ["برتقالي", "أخضر", "أصفر"], answer: "برتقالي" }
        ]
      }
    };

    const storageKey = "bustan-stars-v1";
    let stars = Number(localStorage.getItem(storageKey)) || 0;
    let mode = "letters";
    let index = 0;
    let answered = false;
    const solved = new Set();
    const elements = {
      score: document.querySelector("#score"),
      title: document.querySelector("#lesson-title"),
      count: document.querySelector("#lesson-count"),
      symbol: document.querySelector("#symbol"),
      eyebrow: document.querySelector("#eyebrow"),
      word: document.querySelector("#word"),
      description: document.querySelector("#description"),
      exampleArt: document.querySelector("#example-art"),
      hint: document.querySelector("#quiz-hint"),
      answers: document.querySelector("#answers"),
      feedback: document.querySelector("#feedback"),
      dots: document.querySelector("#dots")
    };
    const arabicDigits = value => String(value).replace(/[0-9]/g, digit => "٠١٢٣٤٥٦٧٨٩"[digit]);

    function updateScore() {
      elements.score.textContent = `${arabicDigits(stars)} ${stars === 1 ? "نجمة" : "نجوم"}`;
    }

    function render() {
      const activity = activities[mode];
      const item = activity.items[index];
      answered = false;
      elements.title.textContent = activity.title;
      elements.count.textContent = `${arabicDigits(index + 1)} من ${arabicDigits(activity.items.length)}`;
      elements.symbol.textContent = mode === "colors" ? "" : item.symbol;
      elements.symbol.classList.toggle("is-emoji", mode !== "letters");
      elements.symbol.style.background = mode === "colors" ? item.color : "var(--yellow)";
      elements.symbol.style.color = mode === "colors" ? item.color : "#59420e";
      elements.symbol.setAttribute("aria-label", mode === "colors" ? item.word : item.symbol);
      elements.eyebrow.textContent = activity.eyebrow;
      elements.word.textContent = item.word;
      elements.description.textContent = item.description;
      elements.exampleArt.textContent = item.emoji;
      elements.hint.textContent = activity.hint(item);
      elements.feedback.textContent = "";
      elements.feedback.className = "feedback";
      elements.dots.innerHTML = activity.items.map((_, dotIndex) => `<span class="dot ${dotIndex === index ? "active" : ""}"></span>`).join("");
      elements.answers.replaceChildren(...item.choices.map(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.textContent = choice;
        button.addEventListener("click", () => checkAnswer(button, choice, item));
        return button;
      }));
    }

    function checkAnswer(button, choice, item) {
      if (answered) return;
      if (choice !== item.answer) {
        button.classList.add("wrong");
        button.disabled = true;
        elements.feedback.textContent = "قربت! جرّب اختيار تاني 🙂";
        elements.feedback.className = "feedback retry";
        return;
      }
      answered = true;
      button.classList.add("correct");
      elements.answers.querySelectorAll("button").forEach(answer => { answer.disabled = true; });
      const key = `${mode}-${index}`;
      if (!solved.has(key)) {
        solved.add(key);
        stars += 1;
        localStorage.setItem(storageKey, String(stars));
        updateScore();
      }
      elements.feedback.textContent = "برافو عليك! إجابة صحيحة ⭐";
      elements.feedback.className = "feedback success";
    }

    document.querySelectorAll(".nav-button").forEach(button => {
      button.addEventListener("click", () => {
        mode = button.dataset.mode;
        index = 0;
        document.querySelectorAll(".nav-button").forEach(nav => nav.setAttribute("aria-pressed", String(nav === button)));
        render();
      });
    });
    document.querySelector("#next").addEventListener("click", () => { index = (index + 1) % activities[mode].items.length; render(); });
    document.querySelector("#previous").addEventListener("click", () => { index = (index - 1 + activities[mode].items.length) % activities[mode].items.length; render(); });
    document.querySelector("#speak").addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        elements.feedback.textContent = "النطق الصوتي غير متاح في هذا المتصفح.";
        elements.feedback.className = "feedback retry";
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(`${activities[mode].items[index].symbol || ""} ${activities[mode].items[index].word}`);
      utterance.lang = "ar-EG";
      utterance.rate = 0.82;
      window.speechSynthesis.speak(utterance);
    });

    updateScore();
    render();
  </script>
</body>
</html>
